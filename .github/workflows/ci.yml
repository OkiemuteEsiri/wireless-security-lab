name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q src
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run configuration-baseline smoke test
        run: |
          python -m src.wireless_security.cli data/synthetic_access_points.json --output reports/generated-baseline.md
          test -s reports/generated-baseline.md
          grep -q "Posture score" reports/generated-baseline.md
